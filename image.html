<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/url_fixing_worker.js"></script>
  <meta charset="UTF-8">
  <title>Magic Image Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    * {
      font-family: "Albert Sans" !important;
    }

    body {
      font-family: "Albert Sans", sans-serif;
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #dbeafe, #f8fafc);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .background-blobs::before,
    .background-blobs::after {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      animation: float 12s infinite alternate ease-in-out;
    }

    .background-blobs::before {
      background: #60a5fa;
      top: -100px;
      left: -100px;
    }

    .background-blobs::after {
      background: #a78bfa;
      bottom: -120px;
      right: -120px;
      animation-delay: 3s;
    }

    @keyframes float {
      from { transform: translateY(0); }
      to { transform: translateY(60px); }
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 440px;
      padding: 28px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.15);
      animation: popIn 0.6s ease-out;
    }

    @keyframes popIn {
      from {
        transform: scale(0.9) translateY(20px);
        opacity: 0;
      }
      to {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
      background: linear-gradient(90deg, #2563eb, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      margin: 8px 0 24px;
      color: #475569;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      border-radius: 14px;
      border: none;
      outline: none;
      background: white;
      box-shadow: inset 0 0 0 2px #e5e7eb;
      transition: box-shadow 0.2s ease;
    }

    input:focus {
      box-shadow: inset 0 0 0 2px #2563eb;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border-radius: 16px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 12px 24px rgba(37,99,235,0.35);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 30px rgba(37,99,235,0.45);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      font-weight: 600;
      color: #2563eb;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .image-container {
      margin-top: 24px;
    }

    img {
      width: 100%;
      border-radius: 18px;
      opacity: 0;
      transform: scale(0.96);
      animation: imageIn 0.6s ease forwards;
    }

    @keyframes imageIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
  <script src="popup-guard.js" defer></script>
</head>
<body>

<div class="background-blobs"></div>

<div class="card">
  <h1>✨ Image Magic</h1>
  <p>Describe anything. Watch it appear.</p>

  <input id="promptInput" placeholder="potato wizard, flying toaster, etc." />

  <button id="generateBtn">Generate Image</button>

  <div id="status" class="status" style="display:none;">Generating magic…</div>

  <div id="imageContainer" class="image-container"></div>
</div>

<script>
  const button = document.getElementById("generateBtn");
  const input = document.getElementById("promptInput");
  const status = document.getElementById("status");
  const imageContainer = document.getElementById("imageContainer");

  button.onclick = async () => {
    const prompt = input.value.trim();
    if (!prompt) return;

    button.disabled = true;
    status.style.display = "block";
    imageContainer.innerHTML = "";

    try {
      const response = await fetch("https://api.kidslearninglab.com/generate_image", {
        method: "POST",
        headers: {
          "Authorization": "Bearer bob",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ prompt })
      });

      const blob = await response.blob();
      const imgUrl = URL.createObjectURL(blob);

      const img = document.createElement("img");
      img.src = imgUrl;
      imageContainer.appendChild(img);

    } catch {
      imageContainer.innerHTML = "<p>Something went wrong.</p>";
    }

    status.style.display = "none";
    button.disabled = false;
  };
</script>

<!-- ============================================================
  Kids Learning Lab — Custom "Smart App Banner"
  Works on ALL devices/browsers (Apple's real one is iOS Safari only).
  Paste this whole block just before </body> on any page you want
  the banner to show up on.
============================================================= -->

<div id="kll-app-banner" class="kll-app-banner" role="banner" aria-label="Get the Kids Learning Lab app">
  <button id="kll-app-banner-close" class="kll-app-banner-close" aria-label="Close">&times;</button>
  <img class="kll-app-banner-icon" src="https://kidslearninglab.com/wp-content/uploads/2025/02/podcast-logo-app-rounded.png" alt="Kids Learning Lab icon">
  <div class="kll-app-banner-text">
    <div class="kll-app-banner-title">Kids Learning Lab</div>
    <div class="kll-app-banner-sub">Learning, trivia, games, all in one</div>
    <div class="kll-app-banner-store">FREE – On the App Store</div>
  </div>
  <a id="kll-app-banner-view" class="kll-app-banner-view" href="https://apps.apple.com/us/app/kids-learning-lab-learning/id6795386180" target="_blank" rel="noopener">GET</a>
</div>

<style>
  .kll-app-banner {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 999999;
    display: none;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: rgba(249, 249, 249, 0.98);
    border-bottom: 1px solid rgba(0,0,0,0.1);
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    animation: kll-slide-down 0.35s ease-out;
  }
  .kll-app-banner.kll-show { display: flex; }

  @keyframes kll-slide-down {
    from { transform: translateY(-100%); }
    to   { transform: translateY(0); }
  }

  .kll-app-banner-close {
    background: none;
    border: none;
    font-size: 22px;
    line-height: 1;
    color: #8e8e93;
    cursor: pointer;
    padding: 0 4px;
    flex-shrink: 0;
  }

  .kll-app-banner-icon {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .kll-app-banner-text {
    flex: 1;
    min-width: 0;
  }

  .kll-app-banner-title {
    font-size: 14px;
    font-weight: 600;
    color: #000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .kll-app-banner-sub {
    font-size: 12px;
    color: #6e6e73;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .kll-app-banner-store {
    font-size: 11px;
    color: #8e8e93;
    margin-top: 1px;
  }

  .kll-app-banner-view {
    flex-shrink: 0;
    color: #007aff;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    padding: 6px 14px;
    background: rgba(0,122,255,0.08);
    border-radius: 14px;
  }

  @media (max-width: 380px) {
    .kll-app-banner-icon { width: 44px; height: 44px; border-radius: 10px; }
    .kll-app-banner-title { font-size: 13px; }
  }
</style>

<script>
  (function () {
    var STORAGE_KEY = "kllAppBannerDismissed";
    var banner = document.getElementById("kll-app-banner");
    var closeBtn = document.getElementById("kll-app-banner-close");

    // Don't show again once dismissed (mirrors Apple's real behavior)
    if (!localStorage.getItem(STORAGE_KEY)) {
      banner.classList.add("kll-show");
      // push page content down so the banner doesn't cover it
      document.body.style.marginTop = banner.offsetHeight + "px";
    }

    closeBtn.addEventListener("click", function () {
      banner.classList.remove("kll-show");
      document.body.style.marginTop = "";
      try { localStorage.setItem(STORAGE_KEY, "1"); } catch (e) {}
    });
  })();
</script>
</body>
</html>
