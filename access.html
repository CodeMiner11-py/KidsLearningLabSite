<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect?</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
        }

        body {
            background: #E8D3B3;
            color: #222;
        }

        /* Confirmation page */
        #confirmation {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 100%;
            max-width: 700px;
        }

        h1 {
            font-size: 44px;
            margin: 0 0 25px;
        }

        p {
            font-size: 22px;
            margin: 0 0 20px;
        }

        #urlDisplay {
            display: block;
            font-size: 20px;
            color: #333;
            word-break: break-all;
            margin-bottom: 32px;
        }

        #accessButton {
            min-width: 170px;
            height: 54px;

            border: none;
            border-radius: 5px;

            background: #666;
            color: white;

            font-family: Arial, sans-serif;
            font-size: 19px;

            cursor: pointer;
        }

        #accessButton:hover {
            background: #555;
        }

        /* Large flat spinner */
        #spinner {
            display: none;
            position: relative;

            width: 76px;
            height: 76px;

            margin: 0 auto;
        }

        .dot {
            position: absolute;

            width: 13px;
            height: 13px;

            left: 31.5px;
            top: 31.5px;

            border-radius: 50%;
            background: #d0d0d0;

            transform-origin: 6.5px 6.5px;
        }

        .dot:nth-child(1) {
            transform: rotate(0deg) translateY(-29px);
            animation: dot1 1s steps(1, end) infinite;
        }

        .dot:nth-child(2) {
            transform: rotate(45deg) translateY(-29px);
            animation: dot2 1s steps(1, end) infinite;
        }

        .dot:nth-child(3) {
            transform: rotate(90deg) translateY(-29px);
            animation: dot3 1s steps(1, end) infinite;
        }

        .dot:nth-child(4) {
            transform: rotate(135deg) translateY(-29px);
            animation: dot4 1s steps(1, end) infinite;
        }

        .dot:nth-child(5) {
            transform: rotate(180deg) translateY(-29px);
            animation: dot5 1s steps(1, end) infinite;
        }

        .dot:nth-child(6) {
            transform: rotate(225deg) translateY(-29px);
            animation: dot6 1s steps(1, end) infinite;
        }

        .dot:nth-child(7) {
            transform: rotate(270deg) translateY(-29px);
            animation: dot7 1s steps(1, end) infinite;
        }

        .dot:nth-child(8) {
            transform: rotate(315deg) translateY(-29px);
            animation: dot8 1s steps(1, end) infinite;
        }

        /*
            Each dot starts light gray.
            One dot at a time becomes gray.
            steps(1) keeps the transition completely instant.
        */

        @keyframes dot1 {
            0% { background: #777; }
            12.5%, 100% { background: #d0d0d0; }
        }

        @keyframes dot2 {
            0%, 12.5% { background: #d0d0d0; }
            12.5% { background: #777; }
            25%, 100% { background: #d0d0d0; }
        }

        @keyframes dot3 {
            0%, 25% { background: #d0d0d0; }
            25% { background: #777; }
            37.5%, 100% { background: #d0d0d0; }
        }

        @keyframes dot4 {
            0%, 37.5% { background: #d0d0d0; }
            37.5% { background: #777; }
            50%, 100% { background: #d0d0d0; }
        }

        @keyframes dot5 {
            0%, 50% { background: #d0d0d0; }
            50% { background: #777; }
            62.5%, 100% { background: #d0d0d0; }
        }

        @keyframes dot6 {
            0%, 62.5% { background: #d0d0d0; }
            62.5% { background: #777; }
            75%, 100% { background: #d0d0d0; }
        }

        @keyframes dot7 {
            0%, 75% { background: #d0d0d0; }
            75% { background: #777; }
            87.5%, 100% { background: #d0d0d0; }
        }

        @keyframes dot8 {
            0%, 87.5% { background: #d0d0d0; }
            87.5% { background: #777; }
            100% { background: #d0d0d0; }
        }

        /* White redirect page */
        #redirecting {
            display: none;

            min-height: 100vh;
            width: 100%;

            background: white;

            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .redirect-message {
            font-size: 22px;
            color: #222;
        }
    </style>
</head>

<body>

    <div id="confirmation">
        <div class="content">
            <h2>Access: Kids Learning Lab Link Processing</h2>
            <br><br>
            <h1>Redirect?</h1>

            <p>Would you like to access the link below?</p>
            <p><b>Secured by Kids Learning Lab Link Processing</b></p>

            <a id="urlDisplay" href="#"></a>

            <button id="accessButton">
                Access Link
            </button>

            <div id="spinner">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

        </div>
    </div>

    <div id="redirecting">
        <div class="redirect-message">
            Redirecting... do not leave this page<br>
            <B>SECURED BY KIDS LEARNING LAB LINK PROCESSING</B>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const url = params.get("url");

        const urlDisplay = document.getElementById("urlDisplay");
        const accessButton = document.getElementById("accessButton");
        const spinner = document.getElementById("spinner");

        const confirmation = document.getElementById("confirmation");
        const redirecting = document.getElementById("redirecting");

        if (!url) {
            urlDisplay.textContent = "No URL provided";
            accessButton.disabled = true;
            accessButton.style.opacity = "0.5";
        } else {
            urlDisplay.textContent = url;
            urlDisplay.href = url;

            accessButton.addEventListener("click", () => {

                // Replace the button with the spinner
                accessButton.style.display = "none";
                spinner.style.display = "block";

                // Spinner stays for exactly 3 seconds
                setTimeout(() => {

                    // Switch to the completely white page
                    confirmation.style.display = "none";
                    redirecting.style.display = "flex";

                    // Then redirect
                    setTimeout(() => {
                        window.location.href = url;
                    }, 500);

                }, 3000);
            });
        }
    </script>

</body>
</html>
