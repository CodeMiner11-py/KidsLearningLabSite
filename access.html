<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect?</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
        }

        body {
            background: #E8D3B3;
            color: #222;
        }

        /* Main redirect confirmation page */
        #confirmation {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 100%;
            max-width: 700px;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 24px;
            font-weight: 700;
        }

        p {
            font-size: 21px;
            margin: 0 0 18px;
        }

        #urlDisplay {
            display: block;
            font-size: 19px;
            color: #333;
            word-break: break-all;
            margin: 0 auto 30px;
        }

        /* Access button */
        #accessButton {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 150px;
            height: 50px;

            padding: 0 22px;
            border: none;
            border-radius: 5px;

            background: #666;
            color: white;

            font-family: Arial, sans-serif;
            font-size: 18px;

            cursor: pointer;
        }

        #accessButton:hover {
            background: #555;
        }

        /* Eight-dot old-style spinner */
        #spinner {
            display: none;

            position: relative;
            width: 52px;
            height: 52px;

            margin: 0 auto;
        }

        .dot {
            position: absolute;

            width: 9px;
            height: 9px;

            background: #d2d2d2;
            border-radius: 50%;

            left: 21.5px;
            top: 21.5px;

            animation: oldSpinner 1s linear infinite;
        }

        .dot:nth-child(1) {
            transform: rotate(0deg) translateY(-20px);
            animation-delay: 0s;
        }

        .dot:nth-child(2) {
            transform: rotate(45deg) translateY(-20px);
            animation-delay: -0.125s;
        }

        .dot:nth-child(3) {
            transform: rotate(90deg) translateY(-20px);
            animation-delay: -0.25s;
        }

        .dot:nth-child(4) {
            transform: rotate(135deg) translateY(-20px);
            animation-delay: -0.375s;
        }

        .dot:nth-child(5) {
            transform: rotate(180deg) translateY(-20px);
            animation-delay: -0.5s;
        }

        .dot:nth-child(6) {
            transform: rotate(225deg) translateY(-20px);
            animation-delay: -0.625s;
        }

        .dot:nth-child(7) {
            transform: rotate(270deg) translateY(-20px);
            animation-delay: -0.75s;
        }

        .dot:nth-child(8) {
            transform: rotate(315deg) translateY(-20px);
            animation-delay: -0.875s;
        }

        @keyframes oldSpinner {
            0%, 100% {
                background: #d8d8d8;
            }

            50% {
                background: #777;
            }
        }

        /* White redirecting page */
        #redirecting {
            display: none;

            min-height: 100vh;
            width: 100%;

            background: white;

            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .redirect-message {
            font-size: 21px;
            color: #222;
        }
    </style>
</head>

<body>

    <div id="confirmation">
        <div class="content">

            <h1>Redirect?</h1>

            <p>Would you like to access the link below?</p>

            <a id="urlDisplay" href="#"></a>

            <button id="accessButton">
                Access Link
            </button>

            <div id="spinner">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

        </div>
    </div>


    <div id="redirecting">
        <div class="redirect-message">
            Redirecting... do not leave this page
        </div>
    </div>


    <script>
        const params = new URLSearchParams(window.location.search);
        const url = params.get("url");

        const urlDisplay = document.getElementById("urlDisplay");
        const accessButton = document.getElementById("accessButton");
        const spinner = document.getElementById("spinner");

        const confirmation = document.getElementById("confirmation");
        const redirecting = document.getElementById("redirecting");

        if (!url) {
            urlDisplay.textContent = "No URL provided";
            accessButton.disabled = true;
            accessButton.style.opacity = "0.5";
        } else {
            urlDisplay.textContent = url;
            urlDisplay.href = url;

            accessButton.addEventListener("click", () => {

                /* Replace button with spinner */
                accessButton.style.display = "none";
                spinner.style.display = "block";

                /*
                 * Keep the spinner visible for a moment,
                 * then switch to the white redirecting page.
                 */
                setTimeout(() => {

                    confirmation.style.display = "none";
                    redirecting.style.display = "flex";

                    /* Redirect */
                    setTimeout(() => {
                        window.location.href = url;
                    }, 500);

                }, 900);
            });
        }
    </script>

</body>
</html>
