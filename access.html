<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect?</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #E8D3B3;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .box {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 32px;
            margin: 0 0 18px;
        }

        p {
            font-size: 17px;
            margin: 10px 0;
        }

        .url {
            display: block;
            margin: 16px 0 22px;
            color: #333;
            word-break: break-all;
        }

        button {
            border: none;
            background: #555;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 16px;
            padding: 11px 18px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #redirecting {
            display: none;
            min-height: 100vh;
            background: white;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 4px solid #ddd;
            border-top-color: #777;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 25px;
        }

        .message {
            font-size: 17px;
            color: #222;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div id="confirmation" class="container">
        <div class="box">
            <h1>Redirect?</h1>

            <p>Would you like to access the link below?</p>

            <a id="urlDisplay" class="url" href="#" target="_blank"></a>

            <button id="accessButton">Access Link</button>
        </div>
    </div>

    <div id="redirecting">
        <div class="spinner"></div>
        <div class="message">Redirecting... do not leave this page</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const url = params.get("url");

        const confirmation = document.getElementById("confirmation");
        const redirecting = document.getElementById("redirecting");
        const urlDisplay = document.getElementById("urlDisplay");
        const accessButton = document.getElementById("accessButton");

        if (!url) {
            urlDisplay.textContent = "No URL provided";
            accessButton.disabled = true;
            accessButton.style.opacity = "0.5";
            accessButton.style.cursor = "not-allowed";
        } else {
            urlDisplay.textContent = url;
            urlDisplay.href = url;

            accessButton.addEventListener("click", () => {
                confirmation.style.display = "none";
                redirecting.style.display = "flex";

                setTimeout(() => {
                    window.location.href = url;
                }, 800);
            });
        }
    </script>

</body>
</html>
