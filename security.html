<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kidslearninglab.com</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:#1a1a1a; }
  .page { max-width:1186px; margin:0 auto; padding:40px; min-height:100%; display:flex; flex-direction:column; }
  .domain { font-size:40px; font-weight:700; margin:0 0 12px; }
  .subtitle { font-size:22px; font-weight:600; margin:0 0 28px; }
  .verify-box { border:1px solid #d9d9d9; background:#fafafa; border-radius:4px; padding:20px 24px; display:inline-flex; align-items:center; gap:16px; max-width:420px; }
  .checkbox { width:28px; height:28px; border:2px solid #4d4d4d; border-radius:3px; flex-shrink:0; background:#fff; display:flex; align-items:center; justify-content:center; cursor:default; }
  .checkbox.checked::after { content:"✓"; font-size:18px; color:#2b7a2b; font-weight:700; }
  .checkbox.spin { border-top-color:#999; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .verify-label { font-size:16px; flex-grow:1; white-space:nowrap; }
  .brand { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .brand img { height:26px; width:auto; object-fit:contain; }
  .brand-links { font-size:10px; color:#4d4d4d; }
  .brand-links a { color:#4d4d4d; text-decoration:underline; }
  .review-line { font-size:22px; margin-top:44px; }
  .spacer { flex-grow:1; }
  hr { border:none; border-top:1px solid #e0e0e0; margin:32px 0 20px; }
  .footer { text-align:center; font-size:13px; color:#6b6b6b; padding-bottom:16px; }
  .footer .sid { margin-bottom:6px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; }
  .footer a { color:#3366cc; text-decoration:none; }

  .challenge { display:none; margin-top:20px; border:1px solid #d9d9d9; border-radius:6px; max-width:420px; overflow:hidden; }
  .challenge-header { background:#1a1a1a; color:#fff; padding:12px 16px; font-size:15px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; background:#000; }
  .tile { position:relative; aspect-ratio:1; background:#ccc; cursor:pointer; overflow:hidden; }
  .tile img { width:100%; height:100%; object-fit:cover; filter:blur(0.4px) contrast(0.95); image-rendering:auto; }
  .tile.selected::after { content:""; position:absolute; inset:0; border:3px solid #2b7a2b; background:rgba(43,122,43,0.15); box-sizing:border-box; }
  .challenge-footer { padding:12px 16px; display:flex; justify-content:space-between; align-items:center; background:#fafafa; }
  .challenge-msg { font-size:12px; color:#c0392b; min-height:16px; }
  button.verify-btn { background:#1a1a1a; color:#fff; border:none; border-radius:4px; padding:8px 16px; font-size:14px; cursor:pointer; }
  button.verify-btn:disabled { background:#999; cursor:default; }
</style>
</head>
<body>
  <div class="page">
    <h1 class="domain">kidslearninglab.com</h1>
    <p class="subtitle">Verify you are human by completing the action below.</p>

    <div class="verify-box">
      <div class="checkbox" id="checkbox"></div>
      <div class="verify-label" id="verifyLabel">Verify you are human</div>
      <div class="brand">
        <img src="https://kidslearninglab.com/wp-content/uploads/2025/02/podcast-logo-app-rounded.png" alt="Kids Learning Lab">
        <div class="brand-links"><a href="#">Privacy</a> &bull; <a href="#">Terms</a></div>
      </div>
    </div>

    <div class="challenge" id="challenge">
      <div class="challenge-header" id="challengeHeader">Select all images of <span id="ideaWord"></span></div>
      <div class="grid" id="grid"></div>
      <div class="challenge-footer">
        <div class="challenge-msg" id="challengeMsg"></div>
        <button class="verify-btn" id="submitBtn">Verify</button>
      </div>
    </div>

    <p class="review-line">kidslearninglab.com needs to review the security of your connection before proceeding.</p>

    <div class="spacer"></div>
    <hr>
    <div class="footer">
      <div class="sid">Security ID: <span id="securityId"></span></div>
      <div>Performance &amp; security by <a href="#">Kids Learning Lab</a></div>
    </div>
  </div>

<script>
const REDIRECT_URL = "https://kidslearninglab.com/newgame";
const API_BASE = "https://pexelsapi.nameless-cherry-998c.workers.dev";
const IDEAS = ["dog","cat","firetruck","shirt","car","bicycle","tree","house","apple","banana",
  "chair","table","boat","airplane","train","bus","flower","mountain","river","beach",
  "guitar","piano","book","pencil","clock","hat","shoe","umbrella","balloon","kite",
  "robot","rocket","castle","bridge","lighthouse","windmill","tractor","helicopter","motorcycle","sailboat",
  "campfire","tent","backpack","sunglasses","watch","camera","telephone","laptop","television","lamp",
  "candle","cupcake","pizza","sandwich","ice cream","watermelon","strawberry","carrot","pumpkin","snowman"];

document.getElementById("securityId").textContent = crypto.randomUUID();

function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

async function fetchTiles(query, count){
  try{
    const res = await fetch(`${API_BASE}/photos/search?query=${encodeURIComponent(query)}&per_page=${count}`);
    const data = await res.json();
    return (data.photos || []).slice(0,count).map(p => p.src && (p.src.tiny || p.src.small));
  }catch(e){ return []; }
}

const checkbox = document.getElementById("checkbox");
const verifyLabel = document.getElementById("verifyLabel");
const challenge = document.getElementById("challenge");
const grid = document.getElementById("grid");
const ideaWord = document.getElementById("ideaWord");
const submitBtn = document.getElementById("submitBtn");
const challengeMsg = document.getElementById("challengeMsg");

function succeed(){
  checkbox.classList.remove("spin");
  checkbox.classList.add("checked");
  verifyLabel.textContent = "Success! Redirecting...";
  challenge.style.display = "none";
  setTimeout(() => { window.location.href = REDIRECT_URL; }, 1200);
}

async function startChallenge(){
  verifyLabel.textContent = "Additional verification required";
  const idea = pick(IDEAS);
  ideaWord.textContent = idea;

  const otherIdeas = shuffle(IDEAS.filter(i => i !== idea)).slice(0,3);
  const [correctUrls, ...distractorArrays] = await Promise.all([
    fetchTiles(idea, 6),
    ...otherIdeas.map(i => fetchTiles(i, 1))
  ]);
  const distractorUrls = distractorArrays.map(a => a[0]).filter(Boolean);

  let tiles = correctUrls.map(u => ({ url: u, correct: true }))
    .concat(distractorUrls.map(u => ({ url: u, correct: false })));
  tiles = shuffle(tiles);

  grid.innerHTML = "";
  const correctIndices = new Set();
  tiles.forEach((t, idx) => {
    if (t.correct) correctIndices.add(idx);
    const div = document.createElement("div");
    div.className = "tile";
    div.dataset.idx = idx;
    const img = document.createElement("img");
    img.src = t.url;
    div.appendChild(img);
    div.addEventListener("click", () => div.classList.toggle("selected"));
    grid.appendChild(div);
  });

  challenge.style.display = "block";
  submitBtn.onclick = () => {
    const selected = new Set([...grid.querySelectorAll(".tile.selected")].map(el => parseInt(el.dataset.idx)));
    const isCorrect = selected.size === correctIndices.size &&
      [...selected].every(i => correctIndices.has(i));
    if (isCorrect) {
      challengeMsg.textContent = "";
      succeed();
    } else {
      challengeMsg.textContent = "Please try again.";
      grid.querySelectorAll(".tile.selected").forEach(el => el.classList.remove("selected"));
    }
  };
}

let started = false;
document.querySelector(".verify-box").addEventListener("click", () => {
  if (started) return;
  started = true;
  verifyLabel.textContent = "Verifying...";
  checkbox.classList.add("spin");
  checkbox.style.cursor = "default";
  setTimeout(() => {
    if (Math.random() < 0.5) {
      succeed();
    } else {
      checkbox.classList.remove("spin");
      startChallenge();
    }
  }, 900);
});
</script>
</body>
</html>
