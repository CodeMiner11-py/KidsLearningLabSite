<!DOCTYPE html>
<html>
<head>
  <title>Bonus Image Creator</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
      padding: 30px;
    }

    canvas {
      margin-top: 20px;
      max-width: 90%;
      border-radius: 10px;
      box-shadow: 0 4px 15px #aaa;
    }

    .preview {
      position: relative;
      display: inline-block;
    }

    input {
      margin: 15px;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: green;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
  <script src="popup-guard.js" defer></script>
</head>

<body>

<h1>Bonus Image Creator</h1>

<input type="file" id="upload" accept="image/*">

<br>

<button onclick="createImage()">Create Preview</button>

<br>

<canvas id="canvas" width="500" height="500"></canvas>

<script>
const upload = document.getElementById("upload");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let img = new Image();

upload.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  img.src = URL.createObjectURL(file);

  img.onload = () => {
    drawPreview();
  };
});

function createImage() {
  drawPreview();
}

function drawPreview() {

  const size = Math.min(img.width, img.height);

  const cropX = (img.width - size) / 2;
  const cropY = (img.height - size) / 2;

  ctx.clearRect(0,0,500,500);

  // Square crop
  ctx.drawImage(
    img,
    cropX,
    cropY,
    size,
    size,
    0,
    0,
    500,
    500
  );

  // Green BONUS tag (bottom 25%)
  ctx.fillStyle = "#00a83b";
  ctx.fillRect(
    0,
    375,
    500,
    125
  );

  // Text
  ctx.font = "bold 70px 'DM Sans'";
  ctx.fillStyle = "white";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText(
    "BONUS",
    250,
    437
  );
}
</script>
