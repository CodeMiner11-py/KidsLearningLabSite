<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/url_fixing_worker.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Episodes — Kids Learning Lab™</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="wp-content/uploads/2025/02/podcast-logo-app-rounded.png">
  <meta name="description" content="Browse all episodes of Kids Learning Lab — a kids podcast made by a 12 year old!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,100..900;1,100..900&family=Funnel+Display:wght@300..800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:        #f5f2ed;
      --bg2:       #edeae3;
      --card:      #ffffff;
      --border:    #ddd9d0;
      --text:      #1a1612;
      --muted:     #6b6459;
      --accent:    #1a6fc4;
      --accent2:   #e8f0fb;
      --active-bg: #1a6fc4;
      --active-fg: #ffffff;
      --radius:    14px;
      --shadow:    0 2px 12px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Albert Sans', sans-serif;
      min-height: 100vh;
    }

    /* ── Page layout ── */
    .ep-page {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.2rem 4rem;
    }

    /* ── Header row: logo + title ── */
    .ep-header {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 2.2rem;
    }

    .ep-header img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(26,111,196,0.18);
      flex-shrink: 0;
    }

    .ep-header-text h1 {
      font-family: 'Funnel Display', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 700;
      line-height: 1.1;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .ep-header-text p {
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── Episode list panel ── */
    .ep-list-panel {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .ep-list-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
    }

    .ep-list-header h2 {
      font-family: 'Funnel Display', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .ep-search {
      width: 100%;
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      font-family: 'Albert Sans', sans-serif;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }
    .ep-search:focus { border-color: var(--accent); }

    .ep-list-scroll {
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .ep-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }

    .ep-item:last-child { border-bottom: none; }
    .ep-item:hover { background: var(--bg2); }

    .ep-item-art {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--bg2);
    }

    .ep-item-info { flex: 1; min-width: 0; }

    .ep-item-title {
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ep-item-date {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .ep-item-dur {
      font-size: 0.75rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .ep-item-arrow {
      font-size: 0.9rem;
      color: var(--muted);
      flex-shrink: 0;
      margin-left: 4px;
    }

    .ep-load-more {
      width: 100%;
      padding: 13px;
      border: none;
      background: var(--bg2);
      color: var(--accent);
      font-family: 'Albert Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      border-top: 1px solid var(--border);
      transition: background 0.15s;
    }
    .ep-load-more:hover { background: var(--border); }

    /* Empty / loading states */
    .ep-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 30px;
      text-align: center;
      color: var(--muted);
      gap: 12px;
    }
    .ep-placeholder svg { width: 48px; height: 48px; fill: var(--border); }
    .ep-placeholder p { font-size: 0.95rem; }

    .ep-spinner {
      width: 22px; height: 22px;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>

<div class="floating-shapes">
  <div class="shape"></div><div class="shape"></div>
  <div class="shape"></div><div class="shape"></div>
</div>

<div id="header"></div>


<main>
  <div class="ep-page">

    <!-- Header -->
    <div class="ep-header">
      <img src="https://kidslearninglab.com/wp-content/uploads/2025/02/podcast-logo-app-rounded.png" alt="Kids Learning Lab logo">
      <div class="ep-header-text">
        <h1>All Episodes</h1>
        <p>By a kid, for kids — pick an episode and start learning!</p>
      </div>
    </div>

    <!-- Episode list (full width now) -->
    <div class="ep-list-panel">
      <div class="ep-list-header">
        <h2>Episodes</h2>
        <input class="ep-search" type="search" id="ep-search" placeholder="Search episodes…">
      </div>
      <div class="ep-list-scroll" id="ep-list-scroll">
        <div class="ep-placeholder">
          <div class="ep-spinner"></div>
          <p>Loading episodes…</p>
        </div>
      </div>
      <button class="ep-load-more" id="ep-load-more" style="display:none">Load more episodes ↓</button>
    </div>

  </div>
</main>

<div id="footer"></div>

<script>
(function () {
  const PER_PAGE = 10;

  let allEpisodes = [];
  let filtered    = [];
  let shownCount  = 0;

  const listScroll  = document.getElementById('ep-list-scroll');
  const loadMoreBtn = document.getElementById('ep-load-more');
  const searchInput = document.getElementById('ep-search');

  /* ── Render list ── */
  function renderList() {
    listScroll.innerHTML = '';
    shownCount = 0;
    appendItems();
  }

  function appendItems() {
    const slice = filtered.slice(shownCount, shownCount + PER_PAGE);
    slice.forEach((ep, i) => {
      const idx = shownCount + i;
      const div = document.createElement('div');
      div.className = 'ep-item';
      div.dataset.idx = idx;
      div.innerHTML = `
        <img class="ep-item-art" src="${ep.art}" alt="" onerror="this.src='${window.KLLPlayer.FALLBACK_ART}'">
        <div class="ep-item-info">
          <div class="ep-item-title">${ep.title}</div>
          <div class="ep-item-date">${window.KLLPlayer.fmtDate(ep.pubDate)}${ep.duration ? ' · ' + ep.duration : ''}</div>
        </div>
        <div class="ep-item-arrow">▶</div>
      `;
      div.addEventListener('click', () => {
        history.replaceState(null, '', '?ep=' + window.KLLPlayer.slugify(ep.title));
        window.KLLPlayer.openEpisodePlayer(ep, filtered);
      });
      listScroll.appendChild(div);
    });
    shownCount += slice.length;
    loadMoreBtn.style.display = shownCount < filtered.length ? 'block' : 'none';
  }

  /* ── Search ── */
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.toLowerCase().trim();
    filtered = q ? allEpisodes.filter(e => e.title.toLowerCase().includes(q) || e.desc.toLowerCase().includes(q)) : allEpisodes;
    renderList();
  });

  loadMoreBtn.addEventListener('click', appendItems);

  /* ── Load episodes (via the shared, 5h-cached KLLPlayer fetcher) ── */
  function waitForPlayer(cb) {
    if (window.KLLPlayer) { cb(); return; }
    setTimeout(() => waitForPlayer(cb), 50);
  }

  async function init() {
    try {
      allEpisodes = await window.KLLPlayer.getEpisodes();
      filtered    = allEpisodes;

      const urlParams = new URLSearchParams(window.location.search);
      const epSlug    = urlParams.get('ep');

      renderList();

      if (epSlug) {
        const target = filtered.find(ep => window.KLLPlayer.slugify(ep.title) === epSlug);
        if (target) window.KLLPlayer.openEpisodePlayer(target, filtered);
      }
    } catch (e) {
      listScroll.innerHTML = '<div class="ep-placeholder"><p>Could not load episodes. Please try again later.</p></div>';
      console.error(e);
    }
  }

  waitForPlayer(init);
})();
</script>

<script src="kll-includes.js"></script>
</body>
</html>
